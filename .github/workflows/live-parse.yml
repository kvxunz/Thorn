name: Live parse regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-parse:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.22
      - name: Install parsing models
        run: uv run --script sidecar/server.py --install-models
      - name: Run real-model regression in the server environment
        run: uv run --script sidecar/server.py --check-regressions
