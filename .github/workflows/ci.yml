name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Swift package targets macOS and uses AppKit/Vision, so Linux cannot
    # run its non-live unit tests. No Ollama, sidecar model, or secrets are
    # needed: live integration tests stay skipped unless explicitly enabled.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Swift unit tests
        run: swift test --skip LiveHYMT2

      - name: Build app bundle smoke test
        run: |
          ./scripts/bundle.sh
          test -x build/Thorn.app/Contents/MacOS/Thorn
          test -f build/Thorn.app/Contents/Resources/sidecar/server.py
          test -f build/Thorn.app/Contents/Resources/sidecar/teaching_tree.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.22

      - name: Validate runtime lock
        run: uv lock --check --script sidecar/server.py

      - name: Run locked sidecar unit, service and lint checks
        run: uv run --locked --script scripts/check_sidecar.py
